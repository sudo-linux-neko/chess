name: Build Chess Studio desktop

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "gui/**"
      - ".github/workflows/chess-studio-desktop.yml"

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-latest
            engine_asset: stockfish-ubuntu-x86-64-avx2.tar
            engine_file: stockfish-ubuntu-x86-64-avx2
            archive: tar
          - name: windows-x64
            os: windows-latest
            engine_asset: stockfish-windows-x86-64-avx2.zip
            engine_file: stockfish-windows-x86-64-avx2.exe
            archive: zip
          - name: macos-arm64
            os: macos-15
            engine_asset: stockfish-macos-m1-apple-silicon.tar
            engine_file: stockfish-macos-m1-apple-silicon
            archive: tar
          - name: macos-x64
            os: macos-15-intel
            engine_asset: stockfish-macos-x86-64-avx2.tar
            engine_file: stockfish-macos-x86-64-avx2
            archive: tar

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Bundle Stockfish and NNUE
        shell: bash
        run: |
          set -euo pipefail
          RES="gui/composeApp/src/desktopMain/resources"
          mkdir -p "$RES/engine" "$RES/nnue"
          TMP="$RUNNER_TEMP/stockfish"
          mkdir -p "$TMP"
          curl -fL --retry 3 --retry-delay 2 \
            -o "$TMP/engine.${{ matrix.archive }}" \
            "https://github.com/official-stockfish/Stockfish/releases/download/sf_16.1/${{ matrix.engine_asset }}"
          mkdir -p "$TMP/extracted"
          if [ "${{ matrix.archive }}" = "zip" ]; then
            if [ "$RUNNER_OS" = "Windows" ]; then
              7z x "$TMP/engine.${{ matrix.archive }}" "-o$TMP/extracted" -y >/dev/null
            else
              unzip -q "$TMP/engine.${{ matrix.archive }}" -d "$TMP/extracted"
            fi
          else
            tar -xf "$TMP/engine.${{ matrix.archive }}" -C "$TMP/extracted"
          fi
          ENGINE=$(find "$TMP/extracted" -type f -name "${{ matrix.engine_file }}" -print -quit)
          test -n "$ENGINE"
          cp "$ENGINE" "$RES/engine/stockfish"
          chmod +x "$RES/engine/stockfish"
          curl -fL --retry 3 --retry-delay 2 \
            -o "$RES/nnue/final.nnue" \
            "https://huggingface.co/neko-i-am-a-cat/chess-nnue/resolve/main/final.nnue"
          curl -fL --retry 3 --retry-delay 2 \
            -o "$RES/nnue/big.nnue" \
            "https://tests.stockfishchess.org/api/nn/nn-baff1ede1f90.nnue"
          ls -lh "$RES/engine" "$RES/nnue"

      - name: Build desktop app
        working-directory: gui
        shell: bash
        run: ./gradlew :composeApp:createDistributable --no-daemon --stacktrace

      - name: Package portable app
        shell: bash
        run: |
          set -euo pipefail
          APP="gui/composeApp/build/compose/binaries/main/app"
          mkdir -p gui/dist
          if [ "$RUNNER_OS" = "Windows" ]; then
            powershell -NoProfile -Command "Compress-Archive -Path '$APP/ChessStudio' -DestinationPath 'gui/dist/ChessStudio-${{ matrix.name }}.zip' -Force"
          elif [ "$RUNNER_OS" = "macOS" ]; then
            (cd "$APP" && zip -qry "$GITHUB_WORKSPACE/gui/dist/ChessStudio-${{ matrix.name }}.zip" "ChessStudio.app")
          else
            (cd "$APP" && tar -czf "$GITHUB_WORKSPACE/gui/dist/ChessStudio-${{ matrix.name }}.tar.gz" "ChessStudio")
          fi
          ls -lh gui/dist

      - uses: actions/upload-artifact@v4
        with:
          name: ChessStudio-${{ matrix.name }}
          path: |
            gui/dist/ChessStudio-${{ matrix.name }}.*
          if-no-files-found: error
