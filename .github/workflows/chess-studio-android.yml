name: Build Chess Studio Android APK

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "gui/**"
      - ".github/workflows/chess-studio-android.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - uses: gradle/actions/setup-gradle@v4

      - name: Bundle Stockfish, big NNUE, and trained NNUE
        shell: bash
        run: |
          set -euo pipefail
          RES="gui/composeApp/src/androidMain"
          mkdir -p "$RES/assets/nnue" "$RES/jniLibs/arm64-v8a"
          TMP="$RUNNER_TEMP/stockfish-android"
          mkdir -p "$TMP"
          curl -fL --retry 3 --retry-delay 2 \
            -o "$TMP/stockfish-android.tar" \
            "https://github.com/official-stockfish/Stockfish/releases/download/sf_16.1/stockfish-android-armv8.tar"
          tar -xf "$TMP/stockfish-android.tar" -C "$TMP"
          ENGINE=$(find "$TMP" -type f -name "stockfish-android-armv8" -print -quit)
          if [ -z "$ENGINE" ]; then
            ENGINE=$(find "$TMP" -type f -name "stockfish*" ! -name "*.tar" ! -name "*.nnue" -print -quit)
          fi
          test -n "$ENGINE"
          cp "$ENGINE" "$RES/jniLibs/arm64-v8a/libstockfish.so"
          chmod +x "$RES/jniLibs/arm64-v8a/libstockfish.so"
          file "$RES/jniLibs/arm64-v8a/libstockfish.so" || true
          curl -fL --retry 3 --retry-delay 2 \
            -o "$RES/assets/nnue/final.nnue" \
            "https://huggingface.co/neko-i-am-a-cat/chess-nnue/resolve/main/final.nnue"
          curl -fL --retry 3 --retry-delay 2 \
            -o "$RES/assets/nnue/big.nnue" \
            "https://tests.stockfishchess.org/api/nn/nn-baff1ede1f90.nnue"
          ls -lh "$RES/assets/nnue" "$RES/jniLibs/arm64-v8a"

      - name: Build APK
        working-directory: gui
        shell: bash
        run: ./gradlew :composeApp:assembleDebug --no-daemon --stacktrace

      - name: Copy APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p gui/dist
          APK=$(find gui/composeApp/build/outputs/apk -type f -name "*.apk" -print -quit)
          test -n "$APK"
          cp "$APK" "gui/dist/ChessStudio-android-arm64.apk"
          ls -lh gui/dist

      - uses: actions/upload-artifact@v4
        with:
          name: ChessStudio-android-arm64
          path: gui/dist/ChessStudio-android-arm64.apk
          if-no-files-found: error
