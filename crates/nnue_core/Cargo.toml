[package]
name = "nnue_core"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
authors = ["Vaibhav"]
description = "High-performance Stockfish binpack reader + HalfKAv2_hm feature extractor for the chess NNUE trainer"

[lib]
name = "nnue_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.30", features = ["extension-module", "abi3-py39"] }
numpy = "0.30"
ndarray = "0.17"
sfbinpack = "0.6.5"
crossbeam-channel = "0.5"
thiserror = "2"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "unwind"
debug = false
