[build-system]
requires = ["maturin>=1.4,<2.0"]
build-backend = "maturin"

[project]
name = "nnue_core"
version = "0.1.0"
description = "Rust core for the chess NNUE trainer: binpack reader + HalfKAv2_hm features"
requires-python = ">=3.9"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "Vaibhav" }]

[tool.maturin]
module-name = "nnue_core"
features = ["pyo3/extension-module"]
