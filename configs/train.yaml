# ============================================================
# Hardware & Distributed Training
# ============================================================
hardware:
  gpus: 2
  precision: "16-mixed"           # fp16 mixed precision (T4 has no bf16)
  num_workers: 12                 # Increased for better data throughput
  prefetch_factor: 8              # More aggressive prefetching
  persistent_workers: true
  pin_memory: true
  compile_model: true             # torch.compile (PyTorch 2.0+)
  channels_last: true             # NHWC memory format for conv-like ops

# ============================================================
# Model Architecture (HalfKAv2_hm) - Optimized
# ============================================================
model:
  feature_set: "HalfKAv2_hm"
  input_dim: 81920                # 64 king squares * 1280 features
  ft_size: 256                    # Feature transformer output per bucket
  hidden_sizes: [256, 32]         # L1=256 (accumulator), L2=32 - better capacity
  output_size: 1
  clipped_relu_max: 1.0
  dropout: 0.0
  # Initialization
  ft_init_scale: 1.0              # Kaiming normal for FT
  hidden_init_scale: 0.5          # Scaled for hidden layers
  output_init_scale: 0.01         # Small for output

# ============================================================
# Training Hyperparameters - Tuned for Elo/hr
# ============================================================
training:
  batch_size: 32768               # Global batch (16384 per GPU) - larger = better gradient estimates
  max_positions: 50000000000      # ~50B positions target
  learning_rate: 0.0012           # Peak LR (higher for larger batch)
  min_lr_ratio: 0.005             # Decay to 0.5% of peak
  warmup_ratio: 0.02              # 2% warmup (longer for stability)
  weight_decay: 1.5e-4            # Slightly higher regularization
  gradient_clip_val: 1.0
  accumulate_grad_batches: 1      # Effective batch = 32768

  # Loss blending - tuned for strength
  wdl_lambda: 0.55                # Slightly favor WDL (better for playing strength)
  score_scale: 370.0              # Stockfish Q value
  label_smoothing: 0.05           # Label smoothing for WDL targets
  eval_loss_type: "huber"         # "mse" | "huber" - Huber more robust
  huber_delta: 100.0              # Huber delta in centipawns

  # Optimizer - AdamW with tuned betas
  optimizer: "adamw"              # More stable than Ranger for NNUE
  beta1: 0.9
  beta2: 0.999
  eps: 1e-8

  # Learning rate schedule
  lr_schedule: "cosine_warm_restarts"  # Cosine with warm restarts
  t0: 50000                       # First restart at 50k steps
  t_mult: 2                       # Double period each restart

# ============================================================
# Time Budget & Scheduling
# ============================================================
time_budget:
  hours: 10.0
  setup_minutes: 25               # Optimized setup
  checkpoint_interval_min: 15     # More frequent (15 min)
  final_save_min: 3

# ============================================================
# Data Pipeline - Optimized for throughput
# ============================================================
data:
  data_dir: "/kaggle/working/data"
  max_data_gb: 18                 # Slightly more data
  shuffle_buffer_mb: 512          # 512MB shuffle buffer (~5M positions)
  num_files_simultaneous: 5       # More file rotation
  drop_last_batch: true           # Consistent batch sizes

  sources:
    - type: "huggingface"
      repo_id: "leela-chess/lichess-binned"
      pattern: "*.binpack"
    - type: "http"
      base_url: "https://trainingdata.stockfishchess.org/"
      pattern: "*.binpack"
    - type: "local"
      path: "/kaggle/input/chess-data"

# ============================================================
# Checkpointing
# ============================================================
checkpoint:
  dir: "/kaggle/working/checkpoints"
  keep_last_n: 5                  # Keep more checkpoints
  save_every_n_steps: null
  atomic_write: true
  include_optimizer: true
  include_scheduler: true
  include_scaler: true
  include_rng: true
  include_data_position: true

# ============================================================
# Hugging Face Upload
# ============================================================
hf:
  repo_id: "vaibhav/nnue-trainer-checkpoints"
  token_env: "HF_TOKEN"
  auto_create_repo: true
  repo_private: false
  upload_workers: 3               # More upload workers
  max_retries: 5
  retry_backoff_base: 1.0
  upload_logs: true
  upload_exports: true

# ============================================================
# Export & Verification
# ============================================================
export:
  dir: "/kaggle/working/export"
  quantize: true
  quantization_method: "per_channel_symmetric"
  verify: true
  verify_samples: 10000
  verify_tolerance_cp: 0.01
  verify_max_error_cp: 1.0

# ============================================================
# Logging
# ============================================================
logging:
  log_every_n_steps: 50           # More frequent logging
  log_dir: "/kaggle/working/logs"
  csv_log: true
  tensorboard: true
  log_gpu_stats: true
  log_grad_norm: true
  log_lr: true

# ============================================================
# Smoke Test Overrides
# ============================================================
smoke_test:
  enabled: false
  max_positions: 1000
  batch_size: 512
  time_budget_hours: 0.05
  checkpoint_interval_min: 1
  num_workers: 0
  data_max_files: 1
  fake_hf_upload: true