#
# Stockfish 16.1 "Small" (L1=128) on free Kaggle 2x T4, 9 hour budget.
# Data: real vondele binpacks, decoded by the Rust core (~10 Mpos/s/rank).

data:
  repo: vondele/master-binpacks_relabel
  repo_type: dataset
  files:
    - fishpack32.relabel-BT4-tf13tune.binpack
  cache_dir: ""          # default: /kaggle/working/data on Kaggle, ./data elsewhere
  cycle: true

train:
  time_budget_hours: 9.0
  batch_size: 16384      # per GPU; global = 2 * this on 2x T4
  grad_accum: 1
  lr: 0.001
  lr_min: 0.00005
  warmup_steps: 1000
  max_steps: 0           # 0 = measure throughput and auto-size to the budget
  min_steps: 100
  measure_steps: 30
  log_every: 50
  checkpoint_minutes: 10
  compile: false
  seed: 42
  lambda_start: 1.0      # 1.0 = pure search-score loss
  lambda_end: 1.0
  grad_clip: 0.0
  loss_window: 100

checkpoint:
  dir: ./checkpoints
  hf_repo: ""            # e.g. thisisforlearn/chess-works-nnue
  repo_type: model
  upload: false
  resume: true
  latest_name: latest.pt

export:
  enabled: true
  description: "SF16.1 Small trained by Vaibhav with the Rust+PyTorch trainer"
  verify_samples: 4096
